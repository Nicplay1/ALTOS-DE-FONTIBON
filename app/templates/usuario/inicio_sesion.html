{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fontibon Contigo</title>
    <link rel="icon" href="{% static 'img/1.png' %}" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/usuario/inicio_sesion.css' %}">
</head>
<body>
    <!-- Contenedor para alertas flash -->
    <div class="alert-container" id="alertContainer"></div>

    <div class="register-container">
        <div class="left-side">
            <img id="left-image" src="{% static 'img/imagen-login.png' %}" alt="Imagen de fondo">
        </div>
        <div class="right-side">
            <div class="logo-container">
                <a href="{% url 'index' %}" class="logo">
                    <img src="{% static 'img/logo.png' %}" alt="Logo">
                </a>
                <h1>Bienvenido</h1>
                <div class="subtitle">¡Fontibon Contigo!</div>
            </div>
            <p class="instruction">Inicia sesión con tus datos para acceder al aplicativo</p>
            
            <form id="loginForm" method="post">
                {% csrf_token %}
                
                <div class="form-group-full">
                    <div class="input-container">
                        <i class="input-icon fas fa-id-card"></i>
                        <input type="text" id="numero_documento" name="numero_documento" class="form-input" placeholder=" " required>
                        <label for="numero_documento" class="form-label">Número de Documento</label>
                    </div>
                    <div id="documento-error" class="error-message"></div>
                </div>
                
                <div class="form-group-full">
                    <div class="input-container">
                        <div class="password-container mt-3">
                            <i class="input-icon fas fa-lock"></i>
                            <input type="password" id="contraseña" name="contraseña" class="form-input" placeholder=" " required>
                            <label for="contraseña" class="form-label">Contraseña</label>
                            <span class="toggle-password" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                    </div>
                    <div id="password-error" class="error-message"></div>
                </div>
                
                <button type="submit" class="register-btn">Ingresar</button>
                
                <div class="forgot-password">
                    <a href="{% url 'solicitar_reset' %}">¿Olvidaste tu contraseña?</a>
                </div>
                
                <div class="login-link">
                    ¿No tienes cuenta? <a href="{% url 'register' %}">Regístrate</a>
                </div>
            </form>
        </div>
    </div>

    <script src="{% static 'js/usuario/inicio_sesion.js' %}"></script>
    <script>
        const loginUrl = "{% url 'login' %}";
    </script>

    {% if messages %}
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                {% for message in messages %}
                    showAlert("{{ message }}", 
                        "{{ message.tags|default:'error' }}".includes("success") ? "success" : "error"
                    );
                {% endfor %}
            });
        </script>
    {% endif %}
</body>
</html>
